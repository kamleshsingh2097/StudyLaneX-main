apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylanex-backend
  namespace: studylanex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studylanex-backend
  template:
    metadata:
      labels:
        app: studylanex-backend
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-uri
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: studylanex-backend
  namespace: studylanex
spec:
  type: NodePort
  selector:
    app: studylanex-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500