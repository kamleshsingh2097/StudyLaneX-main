apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylanex-frontend
  namespace: studylanex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studylanex-frontend
  template:
    metadata:
      labels:
        app: studylanex-frontend
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          ports:
            - containerPort: 4173
          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: studylanex-frontend
  namespace: studylanex
spec:
  type: NodePort
  selector:
    app: studylanex-frontend
  ports:
    - port: 4173
      targetPort: 4173
      nodePort: 30173